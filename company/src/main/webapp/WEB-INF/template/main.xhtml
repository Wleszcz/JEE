<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">
    <f:view>
        <h:head>
            <meta charset="UTF-8"/>
            <meta name="description" content="Company web application"/>
            <meta name="author" content="Wiktor Leszczyński"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>COMPANY</title>

            <h:outputStylesheet library="webjars" name="mdb-ui-kit/6.4.0/css/mdb.min.css"/>
            <h:outputScript library="webjars" name="mdb-ui-kit/6.4.0/js/mdb.min.js"/>
            <h:outputScript library="mdb" name="js/main.js" target="body"/>
        </h:head>

        <h:body>
            <div class="container">
                <header class="mb-4 mt-4">
                    <h1>Company
                        <h:graphicImage height="50px" width="50px" style="margin-bottom: -17px" alt="domek"
                                        value="https://png.pngtree.com/png-vector/20230421/ourmid/pngtree-condominium-line-icon-vector-png-image_6717865.png"/>
                    </h1>
                    <h:form styleClass="container d-flex  align-items-center justify-content-end"
                            rendered="#{facesContext.externalContext.userPrincipal != null}">
                        Logged: <h:outputText value="#{facesContext.externalContext.userPrincipal.name}"/>
                        <h:commandButton styleClass="btn btn-link" value="Logout"
                                         action="#{userLogout.logoutAction()}"/>
                    </h:form>
                </header>

                <nav class="navbar navbar-expand-lg navbar-light bg-light sticky-top">
                    <div class="container-fluid">
                        <ul class="navbar-nav d-flex flex-row justify-content-center mb-2 mb-lg-0">
                            <li class="nav-item mx-2">
                                <h:link styleClass="btn btn-primary" outcome="/index.xhtml">Home</h:link>
                            </li>
                            <li class="nav-item mx-2">
                                <h:link styleClass="btn btn-primary" outcome="/device/device_list.xhtml">Devices</h:link>
                            </li>
                            <li class="nav-item mx-2">
                                <h:link styleClass="btn btn-primary" outcome="/brand/brand_list.xhtml">Brands</h:link>
                            </li>
<!--                            <li class="nav-item mx-2">-->
<!--                                <h:link styleClass="btn btn-primary" outcome="/register.xhtml">Register</h:link>-->
<!--                            </li>-->
                            <h:panelGroup rendered="#{facesContext.externalContext.isUserInRole('admin')}">
                                <li class="nav-item">
                                    <h:link styleClass="nav-link"
                                            outcome="/user/user_list.xhtml">Users</h:link>
                                </li>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{facesContext.externalContext.userPrincipal == null}">
                                <li class="nav-item" style="margin-left: 850px">
                                    <h:link styleClass="nav-link"
                                            outcome="/register.xhtml">Register</h:link>
                                </li>
                            </h:panelGroup>
                        </ul>
                    </div>
                </nav>



                <main class="mb-4 mt-4">
                    <ui:insert name="content"/>
                </main>

                <footer class="text-center text-lg-start bg-light text-muted p-2">
                    <div class="text-center">
                        Copyright &#169; 2024, Wiktor Leszczyński
                    </div>
                </footer>
            </div>
        </h:body>
    </f:view>
</html>

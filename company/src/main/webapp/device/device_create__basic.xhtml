<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{deviceCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create device - basic information</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">
                <h:panelGrid columns="2" style="padding: 10px">
                    <h:button styleClass="btn" value="Previous" disabled="true" style="margin-left: 30px"/>
                    <h:commandButton styleClass="btn" value="Next" style="margin-left: 30px"
                                     action="#{deviceCreate.goToBrandAction()}"/>
                </h:panelGrid>

                <h:panelGrid columns="2" style="padding: 10px">
                    <h:outputLabel for="name" value="Name:" styleClass="form-label"/>
                    <h:inputText id="name" value="#{deviceCreate.device.name}" styleClass="form-control"/>


                    <h:outputLabel for="price" value="PRICE:" styleClass="form-label"/>
                    <h:inputText id="price" value="#{deviceCreate.device.price}" styleClass="form-control"/>

                    <h:outputLabel for="mass" value="Mass:" styleClass="form-label"/>
                    <h:inputText id="mass" value="#{deviceCreate.device.mass}"
                                     styleClass="form-control" rows="4"/>
                </h:panelGrid>
                <h:panelGrid columns="2" style="padding: 10px">
                        <h:button styleClass="btn btn-primary" value="Create" disabled="true" style="margin-left: 30px"/>

                        <h:commandButton styleClass="btn btn-secondary" value="Cancel" style="margin-left: 30px"
                                         action="#{deviceCreate.cancelAction()}"/>
                </h:panelGrid>
            </h:form>
        </article>
    </ui:define>

</ui:composition>

<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{deviceCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create device - basic information</h2></header>
            <h:form styleClass="container" onreset="onReset()">

                <h:panelGrid columns="2" style="padding: 10px">
                    <h:commandButton styleClass="btn" value="Previous" style="margin-left: 30px"
                                     action="#{deviceCreate.goToBasicAction()}"/>
                    <h:commandButton styleClass="btn" value="Next" style="margin-left: 30px"
                                     action="#{deviceCreate.goToConfirmAction()}"/>
                </h:panelGrid>


                <div class="row">
                    <div class="col-4 p-2">
                        <fieldset>
                            <legend class="form-label fs-6">Brand:</legend>
                            <ui:repeat value="#{deviceCreate.brands}" var="device">
                                <div class="form-check">
                                    <h:selectOneRadio id="radioId" group="brando" required="true"
                                                      value="#{deviceCreate.device.brand}"
                                                      label="Brand"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label">
                                        <f:selectItem itemValue="#{device.id}" itemLabel="#{device.name}"/>
                                        <f:validator validatorId="brandValidator"/>
                                    </h:selectOneRadio>
                                    <h:message for="radioId" style="color: red; font-size: small;" />
                                </div>
                            </ui:repeat>
                        </fieldset>
                    </div>

                    <div class="col-4 p-2">
                        <fieldset>
                            <legend class="form-label fs-6">Type:</legend>
                            <ui:repeat value="#{deviceCreate.deviceTypeList}" var="type">
                                <div class="form-check">
                                    <h:selectOneRadio id="type" group="typeo" required="true"
                                                      value="#{deviceCreate.device.deviceType}"
                                                      label="Device Type"
                                                      styleClass="form-check-input"
                                                      enabledClass="form-check-label">
                                        <f:selectItem itemValue="#{type}" itemLabel="#{type}"/>
                                        <f:validator validatorId="deviceTypeValidator"/>
                                    </h:selectOneRadio>
                                    <h:message for="type" style="color: red; font-size: small;" />
                                </div>
                            </ui:repeat>
                        </fieldset>
                    </div>
                </div>

                <h:panelGrid columns="2" style="padding: 10px">
                    <h:button styleClass="btn btn-primary" value="Create" disabled="true" style="margin-left: 30px"/>

                    <h:commandButton styleClass="btn btn-secondary" value="Cancel" style="margin-left: 30px"
                                     action="#{deviceCreate.cancelAction()}"/>
                </h:panelGrid>
            </h:form>
        </article>
    </ui:define>

</ui:composition>

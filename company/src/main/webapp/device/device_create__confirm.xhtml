<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{deviceCreate.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Create device - basic information</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">
                <h:panelGrid columns="2" style="padding: 10px">
                    <h:commandButton styleClass="btn" value="Previous" style="margin-left: 30px"
                                     action="#{deviceCreate.goToBrandAction()}"/>
                    <h:button styleClass="btn" value="Next" disabled="true" style="margin-left: 30px"/>
                </h:panelGrid>

                <h:panelGrid columns="2">
                    <h:outputText style="font-weight: bold" value="Brand ID: "/>
                    <h:outputText value="#{deviceCreate.device.brand}"/>
                    <h:outputText style="font-weight: bold" value="User ID: "/>
                    <h:outputText value="#{deviceCreate.device.user}"/>
                    <h:outputText style="font-weight: bold" value="Name: "/>
                    <h:outputText value="#{deviceCreate.device.name}"/>
                    <h:outputText style="font-weight: bold" value="Mass: "/>
                    <h:outputText value="#{deviceCreate.device.mass}"/>
                    <h:outputText style="font-weight: bold" value="Price: "/>
                    <h:outputText value="#{deviceCreate.device.price}"/>
                    <h:outputText style="font-weight: bold" value="Type: "/>
                    <h:outputText value="#{deviceCreate.device.deviceType}"/>
                </h:panelGrid>
                <h:panelGrid columns="2" style="padding: 10px">
                    <h:commandButton styleClass="btn btn-primary" value="Create"
                                     action="#{deviceCreate.saveAction()}"/>
                    <h:commandButton styleClass="btn btn-secondary" value="Cancel" style="margin-left: 30px"
                                     action="#{deviceCreate.cancelAction()}"/>
                </h:panelGrid>
            </h:form>
        </article>
    </ui:define>

</ui:composition>

<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{deviceEdit.id}" required="true"/>
        <f:viewAction action="#{deviceEdit.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2>Edit device info</h2></header>
            <h:form styleClass="container" onreset="onReset()" enctype="multipart/form-data">
                <h:panelGrid columns="2" style="padding: 10px">
                    <h:outputLabel for="name" value="Name:" styleClass="form-label"/>
                    <h:inputText id="name" value="#{deviceEdit.device.name}" styleClass="form-control"/>


                    <h:outputLabel for="price" value="PRICE:" styleClass="form-label"/>
                    <h:inputText id="price" value="#{deviceEdit.device.price}" styleClass="form-control"/>

                    <h:outputLabel for="mass" value="Mass:" styleClass="form-label"/>
                    <h:inputText id="mass" value="#{deviceEdit.device.mass}"
                                 styleClass="form-control" rows="4"/>
                </h:panelGrid>
                <div class="row" style="display: flex; flex-direction: row">
                    <div class="col-2 p-2 text-center" style="margin: 20px">
                        <h:commandButton styleClass="btn btn-primary" value="Update"
                                         action="#{deviceEdit.saveAction()}"/>
                    </div>
                    <div class="col-2 p-2 text-center" style="margin: 20px">
                        <h:commandButton styleClass="btn btn-secondary" type="reset" value="Reset"/>
                    </div>
                </div>
            </h:form>
        </article>
    </ui:define>

</ui:composition>

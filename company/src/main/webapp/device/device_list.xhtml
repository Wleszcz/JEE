<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <ui:define name="content">

        <article class="text--justified">
            <header><h:outputText value="#{msg.devices}" styleClass="h2"/></header>


            <h:form id="deviceForm">
                <h:panelGrid columns="2" style="padding: 10px">

                    <h:outputLabel for="price" value="#{msg.price}" styleClass="form-label"/>
                    <h:inputText id="price" value="#{deviceList.deviceSearchArgs.price}"/>

                    <h:outputLabel for="mass" value="#{msg.mass}" styleClass="form-label"/>
                    <h:inputText id="mass" value="#{deviceList.deviceSearchArgs.mass}"/>

                    <h:outputLabel for="type" value="Type:" styleClass="form-label"/>
                    <ui:repeat value="#{deviceList.deviceTypeList}" var="type">
                        <div class="form-check">
                            <h:selectOneRadio id="type" group="typeo"
                                              value="#{deviceList.deviceSearchArgs.deviceType}"
                                              label="Device Type"
                                              styleClass="form-check-input"
                                              enabledClass="form-check-label">
                                <f:selectItem itemValue="#{type}" itemLabel="#{type}"/>
                            </h:selectOneRadio>
                        </div>
                    </ui:repeat>
                    <h:commandButton styleClass="btn" action="#{deviceList.searchDevices}" value="#{msg.search}" style="margin: 20px">
<!--                        <f:ajax execute="@this" render="deviceTable" />-->
                    </h:commandButton>
                    <h:outputLabel/>
                </h:panelGrid>

                <h:dataTable value="#{deviceList.devices.devices}" var="device" id="deviceTable"
                             styleClass="table align-middle mb-0 bg-white" headerClass="bg-light">

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.name}"/>
                        </f:facet>
                        <h:outputText value="#{device.name}"/>
                    </h:column>

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.created}"/>
                        </f:facet>
                        <h:outputText value="#{device.createdAt}">
                            <f:converter converterId="localDateTimeConverter"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.updated}"/>
                        </f:facet>
                        <h:outputText value="#{device.updatedAt}">
                            <f:converter converterId="localDateTimeConverter"/>
                        </h:outputText>
                    </h:column>

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.view}"/>
                        </f:facet>
                        <h:link outcome="/device/device_view.xhtml" value="#{msg.view}">
                            <f:param name="id" value="#{device.id}"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.edit}"/>
                        </f:facet>
                        <h:link outcome="/device/device_edit.xhtml" value="#{msg.edit}">
                            <f:param name="id" value="#{device.id}"/>
                        </h:link>
                    </h:column>

                    <h:column>
                        <f:facet name="header">
                            <h:outputText value="#{msg.delete}"/></f:facet>
                        <h:form>
                            <h:commandButton styleClass="btn" value="#{msg.delete}"
                                             actionListener="#{deviceList.deleteAction(device)}">
                                <f:ajax execute="@this" render="deviceTable"/>
                            </h:commandButton>
                        </h:form>
                    </h:column>

                    <f:facet name="footer">
                        <h:button styleClass="btn" outcome="/device/device_create__basic.xhtml"
                                  value="#{msg.createDevice}" style="margin: 20px"/>
                    </f:facet>
                </h:dataTable>
            </h:form>
        </article>
    </ui:define>

</ui:composition>

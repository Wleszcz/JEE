<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/WEB-INF/template/main.xhtml">

    <f:metadata>
        <f:viewParam name="id" value="#{deviceView.id}" required="true"/>
        <f:viewAction action="#{deviceView.init()}"/>
    </f:metadata>

    <ui:define name="content">
        <article>
            <header><h2><h:outputText value="#{deviceView.device.name}"/></h2></header>
            <div class="container">
                <div class="row">
                    <h:panelGrid columns="2" style="margin-bottom: 40px">
                        <h:outputText style="font-weight: bold" value="Brand: "/>
                        <h:outputText value="#{deviceView.device.brand}"/>
                        <h:outputText style="font-weight: bold" value="Mass: "/>
                        <h:outputText value="#{deviceView.device.mass}"/>
                        <h:outputText style="font-weight: bold" value="Price: "/>
                        <h:outputText value="#{deviceView.device.price}"/>
                        <h:outputText style="font-weight: bold" value="Type: "/>
                        <h:outputText value="#{deviceView.device.deviceType}"/>
                        <h:outputText style="font-weight: bold" value="User: " rendered="#{not empty deviceView.device.user}"/>
                        <h:outputText value="#{deviceView.device.user}" rendered="#{not empty deviceView.device.user}"/>
                    </h:panelGrid>
                </div>
            </div>
        </article>
    </ui:define>

</ui:composition>
